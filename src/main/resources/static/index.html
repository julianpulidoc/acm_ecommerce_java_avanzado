<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACM E-commerce · CI/CD</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    main { max-width: 640px; padding: 2rem; text-align: center; }
    h1 { font-size: 2.2rem; margin: 0 0 1rem; color: #38bdf8; }
    .commit { font-family: ui-monospace, monospace; background: #1e293b;
              padding: .4rem .8rem; border-radius: 6px; display: inline-block; }
    a { color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <p>ACM E-commerce · desplegado automáticamente</p>
    <h1 id="message">Cargando…</h1>
    <p>Commit: <span class="commit" id="commit">…</span></p>
    <p><a href="/version">/version</a> · <a href="/swagger-ui.html">API (Swagger)</a></p>
  </main>
  <script>
    fetch('/version')
      .then(r => r.json())
      .then(v => {
        document.getElementById('message').textContent = v.message;
        document.getElementById('commit').textContent = v.commit.substring(0, 7);
      })
      .catch(() => { document.getElementById('message').textContent = 'No se pudo leer /version'; });
  </script>
</body>
</html>
