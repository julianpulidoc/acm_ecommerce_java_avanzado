name: CI/CD

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "25"

jobs:
  # ---------------------------------------------------------------------------
  # 1 · Compilar y probar (CI)
  # ---------------------------------------------------------------------------
  build-test:
    name: "1 · Compilar y probar"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_DB="${{ secrets.DB_NAME }}" \
            -e POSTGRES_USER="${{ secrets.DB_USER }}" \
            -e POSTGRES_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            -p 5434:5432 \
            postgres:16-alpine

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..15}; do
            if docker exec postgres pg_isready -U "${{ secrets.DB_USER }}" > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' postgres)" != "true" ]; then
              docker logs postgres
              exit 1
            fi
            sleep 2
          done
          docker logs postgres
          exit 1

      - name: Build and run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/${{ secrets.DB_NAME }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./gradlew clean build --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/**
          retention-days: 14

      - name: Upload application JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-artifact
          path: build/libs/*-SNAPSHOT.jar
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2 · Imagen Docker → GHCR (Artefacto inmutable)
  # ---------------------------------------------------------------------------
  docker:
    name: "2 · Imagen Docker → GHCR"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t ghcr.io/$IMAGE_LOWER:${{ github.sha }} \
            -t ghcr.io/$IMAGE_LOWER:latest .

      - name: Push Docker image to GHCR
        run: |
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/$IMAGE_LOWER:${{ github.sha }}
          docker push ghcr.io/$IMAGE_LOWER:latest

  # ---------------------------------------------------------------------------
  # 3 · Desplegar en Render + Smoke Test (CD)
  # ---------------------------------------------------------------------------
  deploy:
    name: "3 · Desplegar en Render"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.APP_URL != ''

    steps:
      - name: Trigger Render Continuous Deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "❌ ERROR: El secret RENDER_DEPLOY_HOOK no está configurado."
            exit 1
          fi
          echo "🚀 Disparando despliegue continuo en Render..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Respuesta de Render (HTTP $HTTP_STATUS): $BODY"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "❌ Despliegue en Render falló al disparar el webhook."
            exit 1
          fi
          echo "✅ Despliegue automático en Render disparado con éxito."

      - name: Smoke test (/version)
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          echo "🔍 Esperando que $APP_URL/version responda con el commit $EXPECTED_SHA..."
          for i in $(seq 1 40); do
            RESP=$(curl -sf "$APP_URL/version" || true)
            if [ -n "$RESP" ]; then
              ACTUAL_SHA=$(echo "$RESP" | jq -r '.commit // empty')
              MSG=$(echo "$RESP" | jq -r '.message // empty')
              echo "Intento $i/40 -> commit=$ACTUAL_SHA"
              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                echo "✅ Versión '$MSG' ($ACTUAL_SHA) desplegada en $APP_URL"
                exit 0
              fi
            else
              echo "Intento $i/40 -> esperando respuesta de Render..."
            fi
            sleep 10
          done
          echo "❌ Tiempo agotado esperando el commit $EXPECTED_SHA en $APP_URL/version"
          exit 1
