services:
  database:
    image: postgres:17-alpine
    ports:
      - 5434:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER:-store}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-123456}
      - POSTGRES_DB=${DB_NAME:-ecommerce}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20

  app:
    # Requiere el JAR compilado antes: ./gradlew bootJar
    build:
      context: .
      args:
        GIT_SHA: local
    ports:
      - 8080:8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${DB_NAME:-ecommerce}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-store}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-123456}
    depends_on:
      database:
        condition: service_healthy

volumes:
  postgres_data:
